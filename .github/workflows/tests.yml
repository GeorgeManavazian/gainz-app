name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Supabase client is vi.mock'ed in every test that touches it,
      # so no NEXT_PUBLIC_SUPABASE_* values are needed here.
      - run: npm test
